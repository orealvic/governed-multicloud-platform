version: 2
updates:
  # Keeps SHA-pinned actions current; the version comment is updated too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /modules/*
      - /examples/*
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
