# Reusable: plan or apply one Terraform root in one environment, on GCP or Azure,
# authenticated with GitHub's OIDC token (no stored cloud credentials).
#
# Call it twice per environment: once with mode=plan, then with mode=apply in a
# job that needs the plan job. The apply job downloads the saved plan from the
# same run and applies exactly that plan, so what was reviewed is what ships.
#
#   jobs:
#     plan:
#       uses: orealvic/governed-multicloud-platform/.github/workflows/terraform.yml@<sha> # vX.Y.Z
#       with: { working-directory: infra/envs/prod, environment: prod-plan, mode: plan, cloud: gcp }
#     apply:
#       needs: plan
#       if: needs.plan.outputs.has-changes == 'true'
#       uses: orealvic/governed-multicloud-platform/.github/workflows/terraform.yml@<sha> # vX.Y.Z
#       with: { working-directory: infra/envs/prod, environment: prod, mode: apply, cloud: gcp }
#
# Configuration falls back to Actions variables of the job's environment, so
# callers usually pass only the directory, environment and mode:
#   GCP:    GCP_WIF_PROVIDER, GCP_DEPLOYER_SA
#   Azure:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Both:   TF_BACKEND_CONFIG (newline-separated key=value), TF_VARS_JSON
name: terraform

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: true
      environment:
        type: string
        required: true
        description: GitHub environment the job runs in (its variables and protection rules apply).
      mode:
        type: string
        default: plan
        description: plan | apply
      cloud:
        type: string
        default: gcp
        description: gcp | azure
      terraform-version:
        type: string
        default: "1.9.8"
      backend-config:
        type: string
        default: ""
        description: Newline-separated key=value pairs for terraform init. Falls back to TF_BACKEND_CONFIG.
      tf-vars-json:
        type: string
        default: ""
        description: JSON object written to ci.auto.tfvars.json. Falls back to TF_VARS_JSON.
      gcp-workload-identity-provider:
        type: string
        default: ""
      gcp-service-account:
        type: string
        default: ""
      azure-client-id:
        type: string
        default: ""
      azure-tenant-id:
        type: string
        default: ""
      azure-subscription-id:
        type: string
        default: ""
      plan-artifact:
        type: string
        default: ""
        description: Artifact name shared by the plan and apply calls. Defaults to tfplan-<directory>.
      require-lockfile:
        type: boolean
        default: true
        description: Fail if .terraform.lock.hcl is missing or would change (commit your lock files).
    outputs:
      has-changes:
        description: "true when the plan contains changes"
        value: ${{ jobs.terraform.outputs.has-changes }}

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: ${{ inputs.mode }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    concurrency:
      group: terraform-${{ inputs.working-directory }}-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      MODE: ${{ inputs.mode }}
      CLOUD: ${{ inputs.cloud }}
      BACKEND_CONFIG: ${{ inputs.backend-config || vars.TF_BACKEND_CONFIG }}
      TF_VARS_JSON: ${{ inputs.tf-vars-json || vars.TF_VARS_JSON }}
      ARTIFACT: ${{ inputs.plan-artifact }}
      WORKDIR: ${{ inputs.working-directory }}
      ENVIRONMENT: ${{ inputs.environment }}
      LOCKFILE: ${{ inputs.require-lockfile && 'readonly' || '' }}
    steps:
      - name: Check inputs
        working-directory: .
        run: |
          case "$MODE"  in plan|apply) ;; *) echo "::error::mode must be plan or apply"; exit 1;; esac
          case "$CLOUD" in gcp|azure)  ;; *) echo "::error::cloud must be gcp or azure"; exit 1;; esac
          name="${ARTIFACT:-tfplan-${WORKDIR//\//-}}"
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider || vars.GCP_WIF_PROVIDER }}
          service_account: ${{ inputs.gcp-service-account || vars.GCP_DEPLOYER_SA }}

      - name: Authenticate to Azure
        if: inputs.cloud == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azure-client-id || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure-tenant-id || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure-subscription-id || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azurerm provider for OIDC
        if: inputs.cloud == 'azure'
        env:
          CLIENT_ID: ${{ inputs.azure-client-id || vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ inputs.azure-tenant-id || vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_CLIENT_ID=$CLIENT_ID"
            echo "ARM_TENANT_ID=$TENANT_ID"
            echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID"
          } >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Write variables
        if: env.TF_VARS_JSON != ''
        run: |
          jq -e 'type == "object"' <<< "$TF_VARS_JSON" > /dev/null || { echo "::error::tf-vars-json is not a JSON object"; exit 1; }
          printf '%s' "$TF_VARS_JSON" > ci.auto.tfvars.json

      - name: Init
        run: |
          args=()
          while IFS= read -r line; do
            [ -n "$line" ] && args+=("-backend-config=$line")
          done <<< "$BACKEND_CONFIG"
          [ -n "$LOCKFILE" ] && args+=("-lockfile=$LOCKFILE")
          terraform init "${args[@]}"

      - name: Plan
        id: plan
        if: inputs.mode == 'plan'
        run: |
          set +e
          terraform plan -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            # Show the error, not the plan.
            tail -n 40 plan.log
            exit 1
          fi
          terraform show -no-color tfplan > plan.txt
          if [ "$code" -eq 2 ]; then echo "has-changes=true" >> "$GITHUB_OUTPUT"; else echo "has-changes=false" >> "$GITHUB_OUTPUT"; fi

          # The summary shows counts and resource addresses only; the full plan
          # (which can contain values) stays in the access-controlled artifact.
          {
            echo "### Terraform plan: \`$WORKDIR\` → $ENVIRONMENT"
            echo '```'
            grep -E '^(Plan:|No changes|Changes to Outputs)' plan.txt || true
            grep -E '^  # .* (will|must) be' plan.txt | sed 's/^  # //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/plan.txt
          retention-days: 7
          if-no-files-found: error

      - name: Download plan
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ inputs.working-directory }}

      - name: Apply the reviewed plan
        if: inputs.mode == 'apply'
        run: |
          terraform apply -lock-timeout=5m tfplan
          echo "### Applied \`$WORKDIR\` → $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
